
name: testthat-module

on:
  pull_request:
    branches: [main, development, suz-testthat]
  push:
    branches: [main, development, suz-testthat]

jobs:
  testthat-module:
    uses: suz-estella/actions/.github/workflows/testthat-modules-test.yaml@main
    with:
      module: CBM_core
      extra-config: >-
        [
        {"config":{"os":"windows-latest","r":"release"}},
        {"config":{"os":"macOS-latest",  "r":"release"}}
        ]
      extra-packages: PredictiveEcology/SpaDES.project@development googledrive
      coverage: true
    secrets:
      GOOGLEDRIVE_AUTH: ${{ secrets.GOOGLE_AUTH }}

